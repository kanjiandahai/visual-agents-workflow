name: Pages Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: pages-assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Required files exist
        run: |
          set -euo pipefail
          for f in \
            README.md \
            llms.txt \
            CONTRIBUTING.md \
            docs/index.html \
            docs/app.js \
            docs/styles.css \
            docs/llms.txt \
            docs/robots.txt \
            docs/sitemap.xml \
            docs/og.svg \
            docs/multi-agent.html \
            docs/multi-agent.js \
            docs/MULTI_AGENT.md \
            docs/sample/multi-agent-demo.jsonl \
            server/sse-server.js
          do
            test -f "$f" || { echo "missing: $f"; exit 1; }
            echo "ok $f"
          done

      - name: HTML / meta presence
        run: |
          set -euo pipefail
          html=docs/index.html
          for needle in \
            'rel="canonical"' \
            'property="og:title"' \
            'property="og:description"' \
            'property="og:url"' \
            'property="og:image"' \
            'name="twitter:card"' \
            'href="./styles.css"'
          do
            grep -F "$needle" "$html" >/dev/null || { echo "missing in index.html: $needle"; exit 1; }
            echo "meta ok: $needle"
          done
          grep -F 'src="./app.js"' "$html" >/dev/null || grep -F "src='./app.js'" "$html" >/dev/null || \
            grep -E 'src=["'\'']\./app\.js["'\'']' "$html" >/dev/null || { echo 'app.js script tag missing'; exit 1; }
          echo "script tag ok"

      - name: Relative asset + sitemap sanity
        run: |
          set -euo pipefail
          test -f docs/styles.css
          test -f docs/app.js
          grep -F 'kanjiandahai.github.io/visual-agents-workflow' docs/sitemap.xml >/dev/null
          grep -F 'Sitemap:' docs/robots.txt >/dev/null
          grep -F 'visual-agents-workflow' llms.txt >/dev/null
          grep -F 'visual-agents-workflow' docs/llms.txt >/dev/null
          # og image path referenced by Pages absolute URL
          grep -F 'og.svg' docs/index.html >/dev/null
          grep -F 'src="./multi-agent.js"' docs/multi-agent.html >/dev/null
          grep -F 'multi-agent.html' docs/sitemap.xml >/dev/null
          grep -F 'id: "user"' docs/app.js >/dev/null
          grep -F 'id: "agent"' docs/app.js >/dev/null
          grep -F 'id: "tools"' docs/app.js >/dev/null
          echo "link-sanity ok"
